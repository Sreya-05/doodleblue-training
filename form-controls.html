<!DOCTYPE HTML>
<HTML lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Controls</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <form action="/preferences" method="post">
            <label for="fullname">FullName:</label>
            <input type="text" id="fullname" name="FullName" minlength="2" maxlength="5" required><br>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" minlength="3" maxlength="20" required><br>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" minlength="5" maxlength="7" required><br>
            <br>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" maxlength="10"title="enter a 10 digit phone number" required><br>
            <br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br>
            <br>
            <label for="course">Preferred course:</label>
            <select id="course" name="course" required>
                <option value="">Choose a course</option>

                <option value="html">HTML &amp; CSS</option>
                <option value="JS">Javascript</option>
                <option value="frontend">Frontend Development</option>
            </select><br>
            <br>
            <label for="bio">About you:</label>
            <textarea id="bio" name="bio" rows="2" cols="50" maxlength="300" placeholder="Tell us about yourself"></textarea><br>
            <br>
            <label for="resume">Resume(PDF)</label>
            <input type="file" id="resume" name="resume" accept=".pdf,application/pdf"><br>
            <br>
            <fieldset>
                <legend>Select your Skills</legend>
                <label for="skill-html">
                    <input type="checkbox" id="skill-html" name="skills" value="html"> HTML
                </label>
                <label for="skill-css">
                    <input type="checkbox" id="skill-css" name="skills" value="css"> CSS
                </label>
                <label for="skill-js">
                    <input type="checkbox" id="skill-js" name="skills" value="js"> Javascript
                </label>
            </fieldset><br>
            <fieldset>
                <legend>Experience Level</legend>
                <label for="level-beginner">
                    <input type="radio" id="level-beginner" name="level" value="beginner"> Beginner
                </label>
                <label for="level-intermediate">
                    <input type="radio" id="level-intermediate" name="level" value="intermediate"> Intermediate
                </label>
                <label for="level-advanced">
                    <input type="radio" id="level-advanced" name="level" value="advanced"> Advanced
                </label>
            </fieldset><br>

            <button type="submit">Create Account</button>
            <button type="reset">Clear form</button>
        </form>
    </main>
</body>
