<!DOCTYPE html>
<html lang="en">
    <body>
    <h1>7. mouseover and mouseout</h1>
    <p>Move the pointer over the box and then away. These events can also tire around child element</p>
    <div> id="target" class="box">Move your pointer over me<br>
        <strong>try moving over this child text.</strong>
    </div>
    <p id="result" class="result">waiting...</p>
    <script>
    const target= document.querySelector("#target");
    const result= document.querySelector("#result");
    target.addEventListener("mouseover", () =>{
        target.style.backgroundColor="#fed7aa";
        result.textContent="mouseover fired";
    })
    </script>
    

</html>
