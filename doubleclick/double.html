<!DOCTYPE html>
<html lang="en">
    <head>
        <body>
            <h1>6. dblclick Event</h1>
            <p> Double click the text below to change it.</p>
            <p> id="target" class="box">Double-click the box</p>
            <script>
                const target= document.querySelector("#target");
                target.addEventListener("dblclick", () => {
                    target.textContent="You double clicked the box!";
                    target.style.backgroundColo"#bbf7d0";
                });
            </script>
        </body>
    </head>
</html>
